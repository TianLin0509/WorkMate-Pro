name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build from source
        shell: pwsh
        run: .\scripts\build.ps1 -Clean

      - name: Run isolated WorkMate gates
        shell: pwsh
        run: .\scripts\verify-v124-stress.ps1 -SequentialSelfTests 2 -ParallelSelfTests 2

      - name: Upload unsigned CI build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WorkMate-ci-unsigned
          path: dist/WorkMate.exe
          if-no-files-found: error
          retention-days: 7
